spring.application.name=financas-api

# Nome e configurações do Banco H2 (roda na memória, ótimo para testes rápidos)
spring.datasource.url=jdbc:h2:mem:financasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilita uma tela no navegador para vermos as tabelas e dados visualmente
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualiza as tabelas automaticamente sempre que mudarmos algo no código
spring.jpa.hibernate.ddl-auto=update

# Mostra no terminal os comandos SQL que o Spring está fazendo por trás dos panos
spring.jpa.show-sql=true